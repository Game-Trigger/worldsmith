<title>Worldsmith</title>
<style>
/*
  Layout: a one-screen workbench. Left column stacks the live 3D result (top) over the code editor (bottom);
  right column holds the current mission and the coach's running feedback. Below 960px everything stacks.
  Palette: deep midnight + ember gold + adventure green - Codedex-inspired dark adventure theme.
  Type: Press Start 2P (pixel headings), Inter (body), JetBrains Mono (code).
*/
:root {
  /* ---- core palette ---- */
  --bg: #0d1117;
  --bg2: #131920;
  --panel: #161d27;
  --panel-2: #1c2535;
  --panel-3: #212c3d;
  --line: #243044;
  --text: #e2e8f0;
  --muted: #6b7e9a;
  --accent: #f5c542;
  --accent-ink: #1a1200;
  --accent-soft: rgba(245, 197, 66, 0.12);
  --accent-glow: rgba(245, 197, 66, 0.25);
  --ok: #4ade80;
  --ok-soft: rgba(74, 222, 128, 0.12);
  --err: #f87171;
  --err-soft: rgba(248, 113, 113, 0.12);
  --blue: #38bdf8;
  --blue-soft: rgba(56, 189, 248, 0.12);
  --purple: #a78bfa;
  --code-bg: #090e14;
  --syn-kw: #e68b6b;
  --syn-str: #a1cd7e;
  --syn-num: #e8b957;
  --syn-com: #4a6178;
  --syn-var: #93c5fd;
  --syn-api: #f5c542;
  --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 32px rgba(0,0,0,0.5);
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.7);
  --f-display: "Press Start 2P", "Courier New", monospace;
  --f-title: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}


* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 12px;
}
button { font: inherit; color: inherit; }
code, kbd { font-family: var(--f-mono); font-size: 0.92em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ========== GLOBAL SCROLLBAR ========== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

/* ========== APP SHELL (lesson view) ========== */
.app { display: flex; flex-direction: column; gap: 12px; min-height: 100%; }
.app[hidden], .view[hidden] { display: none; }

/* ========== VIEWS (home + journey) ========== */
.view { min-height: 100%; display: flex; flex-direction: column; gap: 0; animation: viewin 0.28s cubic-bezier(0.22,1,0.36,1); padding: 0; margin: 0; }
@keyframes viewin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ========== GLOBAL NAV BAR ========== */
.ws-nav {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  padding: 0 24px; height: 56px;
  background: rgba(13,17,23,0.88);
  backdrop-filter: blur(16px) saturate(1.4);
  border-bottom: 1px solid var(--line);
}
.ws-nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
.ws-nav-brand .ws-logo-pixel {
  font-family: var(--f-display); font-size: 10px; color: var(--accent);
  line-height: 1; letter-spacing: 0.05em;
  border: 2px solid var(--accent);
  padding: 4px 6px; border-radius: 4px;
}
.ws-nav-brand .ws-logo-full { font-family: var(--f-title); font-weight: 700; font-size: 18px; }
.ws-nav .sp { flex: 1; }
.ws-nav .seg { margin-left: 0; }

/* ========== HOME VIEW: PIXEL HERO ========== */
.home-hero {
  position: relative; overflow: hidden;
  min-height: min(60vh, 480px);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 48px 24px 56px;
  background:
    linear-gradient(180deg, rgba(13,17,23,0) 0%, rgba(13,17,23,0.6) 70%, var(--bg) 100%),
    linear-gradient(135deg, #0d1f2e 0%, #1a2740 40%, #0d2b1e 100%);
}
.home-hero-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; opacity: 0.55;
}
.home-hero-inner { position: relative; max-width: 720px; }
.home-eyebrow {
  display: inline-block; margin-bottom: 16px;
  font-family: var(--f-display); font-size: 9px;
  letter-spacing: 0.15em; color: var(--accent);
  text-transform: uppercase;
}
.home-hero-title {
  font-family: var(--f-display); font-size: clamp(18px, 5vw, 36px);
  line-height: 1.3; letter-spacing: -0.01em; margin-bottom: 8px;
  color: #fff;
  text-shadow: 0 2px 20px rgba(245,197,66,0.3);
}
.home-hero-promise {
  font-size: clamp(15px, 2.5vw, 18px);
  color: rgba(226,232,240,0.75); max-width: 44ch; margin: 0 auto 28px;
  line-height: 1.65;
}
.home-cta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: center; }
.btn-hero {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 32px; border-radius: 10px; border: none;
  background: var(--accent); color: var(--accent-ink);
  font-family: var(--f-body); font-weight: 700; font-size: 16px;
  cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 24px var(--accent-glow);
}
.btn-hero:hover { transform: translateY(-2px); box-shadow: 0 8px 32px var(--accent-glow); }
.btn-hero:active { transform: translateY(0); }
.btn-hero-sec {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 24px; border-radius: 10px;
  border: 1.5px solid var(--line); background: transparent; color: var(--text);
  font-family: var(--f-body); font-weight: 600; font-size: 15px;
  cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.15s;
}
.btn-hero-sec:hover { background: var(--panel-2); border-color: var(--muted); transform: translateY(-1px); }
.home-note { font-size: 12px; color: var(--muted); margin-top: 10px; }

/* pixel tree decorations */
.pixel-tree {
  position: absolute; bottom: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center;
  gap: 0;
}
.pixel-tree .pt-top {
  width: 0; height: 0;
  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  border-bottom: 36px solid #2d5a27;
}
.pixel-tree .pt-mid {
  width: 0; height: 0;
  border-left: 28px solid transparent;
  border-right: 28px solid transparent;
  border-bottom: 40px solid #246b20;
  margin-top: -12px;
}
.pixel-tree .pt-bot {
  width: 0; height: 0;
  border-left: 34px solid transparent;
  border-right: 34px solid transparent;
  border-bottom: 44px solid #1e5e19;
  margin-top: -16px;
}
.pixel-tree .pt-trunk {
  width: 12px; height: 22px; background: #6b4a30;
}

/* ========== HOME ENGINE SECTION ========== */
.home-body {
  background: var(--bg);
  padding: 40px 24px 60px;
  max-width: 960px; margin: 0 auto; width: 100%;
}
.home-sec-title {
  font-family: var(--f-title); font-weight: 700; font-size: 20px;
  margin-bottom: 16px; color: var(--text);
}
.home-engine-note { font-size: 12px; color: var(--muted); margin-top: 12px; }

/* ========== JOURNEY VIEW ========== */
.journey-hero {
  position: relative; overflow: hidden;
  padding: 40px 24px 32px;
  background:
    linear-gradient(180deg, rgba(13,17,23,0) 0%, var(--bg) 100%),
    linear-gradient(135deg, #0d1f2e 0%, #1a2740 60%, #0d2b1e 100%);
  border-bottom: 1px solid var(--line);
}
.journey-hero-inner { max-width: 960px; margin: 0 auto; }
.journey-hero-row { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.journey-title {
  font-family: var(--f-title); font-weight: 800; font-size: clamp(22px, 5vw, 36px);
  letter-spacing: -0.02em; flex: 1;
}
.journey-title span { color: var(--accent); }
.journey-xp-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 999px;
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  color: var(--accent); font-weight: 700; font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.journey-xp-badge::before { content: '⭐'; font-size: 13px; }
.journey-progress-wrap { display: flex; flex-direction: column; gap: 6px; }
.journey-progress-label { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.journey-bar {
  height: 8px; border-radius: 99px;
  background: var(--panel-3);
  overflow: hidden;
}
.journey-bar-fill {
  height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), var(--ok));
  transition: width 0.6s cubic-bezier(0.22,1,0.36,1);
  box-shadow: 0 0 12px var(--accent-glow);
}

/* ========== JOURNEY BODY (2-col layout) ========== */
.journey-body {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 32px;
  max-width: 960px; margin: 0 auto;
  padding: 32px 24px 60px;
  align-items: start;
}
@media (max-width: 768px) {
  .journey-body { grid-template-columns: 1fr; }
  .journey-sidebar { order: -1; }
}

/* ========== CHAPTER CARDS ========== */
.chapter-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 16px;
  transition: border-color 0.2s;
}
.chapter-card:hover { border-color: var(--panel-3); }
.chapter-header {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 20px; cursor: pointer;
  user-select: none;
}
.chapter-num {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center; flex: none;
  background: var(--panel-2); border: 2px solid var(--line);
  font-family: var(--f-display); font-size: 10px; font-weight: 700;
  color: var(--muted);
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.chapter-card.open .chapter-num {
  background: var(--accent); border-color: var(--accent);
  color: var(--accent-ink); box-shadow: 0 0 16px var(--accent-glow);
}
.chapter-card.done .chapter-num {
  background: var(--ok); border-color: var(--ok); color: #052e10;
}
.chapter-card.soon .chapter-num { opacity: 0.4; }
.chapter-info { flex: 1; min-width: 0; }
.chapter-label {
  font-size: 11px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px;
}
.chapter-name {
  font-family: var(--f-title); font-weight: 700; font-size: 18px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chapter-card.soon .chapter-name { color: var(--muted); }
.chapter-badge {
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px;
  white-space: nowrap;
}
.chapter-badge.soon { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.chapter-badge.done { background: var(--ok-soft); color: var(--ok); }
.chapter-badge.club { background: var(--blue-soft); color: var(--blue); }
.chapter-chevron {
  width: 20px; height: 20px; color: var(--muted);
  transition: transform 0.2s;
  flex: none;
}
.chapter-card.expanded .chapter-chevron { transform: rotate(180deg); }

/* chapter body */
.chapter-body {
  display: none;
  border-top: 1px solid var(--line);
  padding: 12px 16px 20px;
}
.chapter-card.expanded .chapter-body { display: block; }
.chapter-desc {
  font-size: 13.5px; color: var(--muted);
  padding: 8px 4px 16px;
  line-height: 1.65;
}

/* exercise rows */
.exercise-list { display: flex; flex-direction: column; gap: 4px; }
.exercise-row {
  display: grid; grid-template-columns: 80px 1fr auto;
  align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 8px;
  background: var(--panel-2);
  transition: background 0.15s;
}
.exercise-row:hover:not(.locked) { background: var(--panel-3); }
.exercise-row.locked { opacity: 0.55; }
.ex-num {
  font-size: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.ex-name { font-size: 14px; font-weight: 500; }
.exercise-row.locked .ex-name { color: var(--muted); }
.ex-action { }
.btn-start {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 18px; border-radius: 8px; border: none;
  background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 13px;
  cursor: pointer; transition: transform 0.1s, filter 0.1s;
  white-space: nowrap;
}
.btn-start:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn-locked {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel-3);
  color: var(--muted); font-size: 12px;
  cursor: not-allowed;
  white-space: nowrap;
}
.btn-done {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 14px; border-radius: 8px;
  border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent);
  background: var(--ok-soft);
  color: var(--ok); font-size: 13px; font-weight: 600;
  cursor: pointer; white-space: nowrap; transition: filter 0.1s;
}
.btn-done:hover { filter: brightness(1.1); }

/* locked info tooltip-like */
.locked-reason {
  font-size: 11.5px; color: var(--err); margin-top: 4px;
  padding: 4px 8px; background: var(--err-soft); border-radius: 6px;
  display: none;
}
.exercise-row.locked:hover .locked-reason { display: block; }

/* ========== JOURNEY SIDEBAR ========== */
.journey-sidebar { display: flex; flex-direction: column; gap: 16px; }
.sidebar-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
}
.sidebar-title {
  font-family: var(--f-title); font-weight: 700; font-size: 15px;
  margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;
}
.sidebar-title span { font-size: 12.5px; color: var(--muted); font-weight: 400; }
.sidebar-stat {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.sidebar-stat:last-child { border-bottom: none; }
.sidebar-stat-icon {
  width: 36px; height: 36px; border-radius: 8px;
  display: grid; place-items: center; flex: none;
  font-size: 18px;
}
.sidebar-stat-icon.lessons { background: var(--blue-soft); }
.sidebar-stat-icon.xp { background: var(--accent-soft); }
.sidebar-stat-body { flex: 1; min-width: 0; }
.sidebar-stat-label { font-size: 12.5px; color: var(--muted); }
.sidebar-stat-value { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.sidebar-stat-bar { height: 4px; border-radius: 99px; background: var(--panel-3); margin-top: 4px; overflow: hidden; }
.sidebar-stat-bar i { display: block; height: 100%; border-radius: inherit; background: var(--ok); }

/* flash message */
.flash {
  margin: 0 24px 0; padding: 12px 16px;
  border-radius: 10px;
  background: var(--accent-soft);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  font-size: 13.5px; color: var(--text);
  animation: viewin 0.2s ease-out;
}
.flash[hidden] { display: none; }

/* ========== ENGINE CARDS (for home) ========== */
.engines { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.engine {
  text-align: left; display: grid; grid-template-columns: 44px 1fr;
  gap: 4px 12px; align-items: center; padding: 14px; min-height: 76px;
  border-radius: 12px; border: 2px solid var(--line); background: var(--panel);
  cursor: pointer; transition: border-color 0.15s, transform 0.15s;
}
.engine:hover { transform: translateY(-1px); border-color: var(--panel-3); }
.engine[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.engine svg { grid-row: span 2; width: 44px; height: 44px; }
.engine strong { font-size: 15px; }
.engine span { font-size: 12.5px; color: var(--muted); }
.eng-sel {
  min-height: 36px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text);
  padding: 0 8px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
}

/* ========== LESSON HEADER (existing) ========== */
.view-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.view-top .sp { flex: 1; }
.back {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--line); background: transparent; cursor: pointer;
  font-weight: 600; font-size: 13.5px;
}
.back:hover { background: var(--panel-2); }
.back svg { width: 14px; height: 14px; }
.pv-title { position: absolute; right: 10px; top: 10px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; background: rgba(0, 0, 0, 0.35); color: #fff; pointer-events: none; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-title); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
.brand svg { width: 26px; height: 26px; flex: none; }
.path { flex: 1 1 360px; min-width: 0; display: flex; align-items: center; gap: 12px; }
.path-name { font-size: 13px; color: var(--muted); white-space: nowrap; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; align-items: flex-start; flex: 1; min-width: 0; }
.steps li { display: flex; align-items: flex-start; flex: 1 1 0; min-width: 0; }
.steps li:last-child { flex: 0 0 auto; }
.step { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; cursor: pointer; min-width: 44px; }
.step[disabled] { cursor: not-allowed; }
.dot {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  border: 2px solid var(--line); background: var(--panel); color: var(--muted);
  font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums;
  transition: background-color 0.2s, border-color 0.2s, color 0.2s;
}
.dot svg { width: 14px; height: 14px; }
.step.done .dot { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.step.current .dot { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.step-label { font-size: 11.5px; color: var(--muted); max-width: 90px; text-align: center; line-height: 1.2; }
.step.current .step-label { color: var(--text); }
.link { flex: 1; height: 2px; background: var(--line); margin: 14px 4px 0; border-radius: 2px; min-width: 8px; }
.link.done { background: var(--ok); }
.tools { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.xp { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.xp.pop { animation: pop 0.5s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.18); } 100% { transform: scale(1); } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 6px 11px; min-height: 32px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); }

/* ---------- panels ---------- */
.stage, .side { display: contents; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }

/* preview */
.preview { position: relative; overflow: hidden; height: clamp(250px, 42vh, 420px); order: 1; background: var(--panel-2); }
.preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
.preview canvas:active { cursor: grabbing; }
.chips { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.chip { font-size: 12px; font-variant-numeric: tabular-nums; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--bg) 78%, transparent); border: 1px solid var(--line); color: var(--muted); backdrop-filter: blur(4px); }
.chip b { color: var(--text); font-weight: 600; margin-left: 4px; }
.pv-help { position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; color: var(--muted); pointer-events: none; padding: 2px 8px; border-radius: 6px; background: color-mix(in srgb, var(--bg) 70%, transparent); }
.empty { position: absolute; inset: 0; display: grid; place-content: center; padding: 16px; pointer-events: none; }
.empty > div { text-align: center; padding: 14px 20px; border-radius: 10px; background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); box-shadow: var(--shadow); max-width: 34ch; }
.empty strong { display: block; font-family: var(--f-title); font-size: 17px; color: var(--text); }
.empty span { display: block; color: var(--muted); margin-top: 2px; }
.empty[hidden] { display: none; }
.glerr { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; text-align: center; color: var(--err); }

/* editor */
.editor { order: 3; display: flex; flex-direction: column; overflow: hidden; height: clamp(300px, 44vh, 420px); }
.ed-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.file { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); padding: 3px 8px; border-radius: 6px; background: var(--panel-2); }
.ed-bar .sp { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; border: 1px solid var(--line); background: transparent; padding: 7px 13px; min-height: 36px; cursor: pointer; font-weight: 500; transition: background-color 0.15s, border-color 0.15s, transform 0.1s; }
.btn:hover { background: var(--panel-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn svg { width: 13px; height: 13px; }
.btn kbd { font-size: 11px; opacity: 0.75; padding-left: 2px; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.ed-body { flex: 1; min-height: 0; position: relative; background: var(--code-bg); }
.ed-body[hidden] { display: none; }
.ed-tabs button { min-height: 36px; }
.ed-tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.pm { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: var(--code-bg); }
.pm[hidden] { display: none; }
.pm-off { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); font-size: 13px; }
.pm-off[hidden] { display: none; }
.pm label { font-size: 12.5px; color: var(--muted); }
.pm textarea { width: 100%; box-sizing: border-box; min-height: 76px; resize: vertical; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 14px/1.45 var(--f-body); }
.pm textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.pm textarea:disabled { opacity: 0.55; cursor: not-allowed; }
.pm-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pm-row .sp { flex: 1; }
.pm-count, .pm-cmds { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pm-status { font-size: 13px; color: var(--muted); min-height: 1.4em; overflow-wrap: anywhere; }
.pm-status.err { color: var(--err); }
.pm-status.ok { color: var(--ok); }
.pm-status.busy::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 7px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: pmspin 0.8s linear infinite; vertical-align: -1px; }
@keyframes pmspin { to { transform: rotate(360deg); } }
.pm-result { padding: 9px 11px; border-radius: 8px; background: var(--ok-soft); font-size: 13.5px; }
.pm-result[hidden] { display: none; }
.pm-result p { margin: 0 0 6px; }
.pm-result .tag { margin-top: 6px; font-size: 11.5px; color: var(--muted); }
.fg-cap { margin: 0 0 4px !important; font-size: 12.5px; color: var(--muted); }
.fg-code { margin: 0 0 8px; padding: 6px 9px; border-radius: 6px; background: var(--panel-2); font: 12.5px/1.45 var(--f-mono); overflow-wrap: anywhere; white-space: pre-wrap; }
.fg-head { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.fg-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.fg-none { margin: 0; font-size: 13px; color: var(--muted); }
.fg-item { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
.fg-item button { background: transparent; border: 0; color: var(--text); cursor: pointer; padding: 6px 10px; min-height: 36px; font: 13px var(--f-body); }
.fg-item button:hover { background: var(--panel-2); }
.fg-item button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.fg-item .del { color: var(--muted); border-left: 1px solid var(--line); padding: 6px 9px; }
.fg-item button:disabled { opacity: 0.5; cursor: not-allowed; }
.ed-body .CodeMirror { position: absolute; inset: 0; height: 100%; }
.status { display: flex; gap: 8px; align-items: baseline; padding: 7px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); min-height: 34px; font-variant-numeric: tabular-nums; }
.status span { min-width: 0; overflow-wrap: anywhere; }
.status code { background: color-mix(in srgb, var(--text) 10%, transparent); padding: 1px 5px; border-radius: 4px; }
.status.ok { color: var(--ok); }
.status.err { color: var(--err); background: var(--err-soft); }

/* mission card */
.mission { order: 2; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.mission .count { font-size: 12.5px; color: var(--muted); }
.mission h2 { font-family: var(--f-title); font-size: 22px; line-height: 1.15; margin: 2px 0 0; letter-spacing: -0.01em; text-wrap: balance; }
.mission p { margin: 0; max-width: 62ch; }
.goals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.goals-title { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
.goal { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; background: var(--panel-2); }
.goal .ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; color: transparent; transition: background-color 0.2s, border-color 0.2s; }
.goal .ck svg { width: 11px; height: 11px; }
.goal.done .ck { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.goal .gl { flex: 1; min-width: 0; }
.goal .now { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.goal.done .now { color: var(--ok); }

/* coach log */
.log { order: 4; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.log-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-family: var(--f-title); font-weight: 700; }
.log-head svg { width: 20px; height: 20px; }
.msgs { flex: 1; min-height: 140px; max-height: 340px; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 9px 12px; border-radius: 4px 12px 12px 12px; background: var(--panel-2); max-width: 100%; overflow-wrap: anywhere; animation: rise 0.25s ease-out; }
.msg.hint { background: var(--accent-soft); }
.msg.error { background: var(--err-soft); }
.msg.success { background: var(--ok-soft); }
.msg code { background: color-mix(in srgb, var(--text) 10%, transparent); padding: 1px 5px; border-radius: 4px; }
.msg ul { margin: 6px 0 0; padding-left: 18px; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line); }
.foot { padding: 0 14px 12px; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 32px; }
.log-head .sp { flex: 1; }
.log-head .seg button { padding: 3px 10px; }
.log-head .seg button:disabled { opacity: 0.45; cursor: not-allowed; }
.srv { font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.srv::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.srv.ready::before { background: var(--ok); }
.srv.off::before { background: var(--err); }
.note { margin: 0 0 6px; font-size: 12px; color: var(--muted); max-width: 52ch; }
.msg.pending { background: var(--panel-2); color: var(--muted); font-style: italic; }
.tag { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
.tag b { font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.tag.rules b { background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.tag .linkbtn { min-height: 24px; padding: 0; font-size: 11.5px; }
.msg .verdict { font-weight: 600; }
.task { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
.task h4 { margin: 0 0 4px; font-family: var(--f-title); font-size: 15px; }
.task p { margin: 0 0 6px; }
.task ul { margin: 0 0 8px; padding-left: 18px; }
.task .btn { margin-top: 2px; }

/* confirm bar */
.confirm { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; width: min(94vw, 540px); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--accent); box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4); }
.confirm p { margin: 0; flex: 1 1 220px; }
.confirm .row { display: flex; gap: 8px; }

/* CodeMirror theme */
.cm-s-ws.CodeMirror { background: var(--code-bg); color: var(--text); font-family: var(--f-mono); font-size: 13.5px; line-height: 1.6; }
.cm-s-ws .CodeMirror-gutters { background: var(--code-bg); border-right: 1px solid var(--line); }
.cm-s-ws .CodeMirror-linenumber { color: var(--syn-com); padding: 0 8px 0 6px; }
.cm-s-ws .CodeMirror-cursor { border-left: 2px solid var(--accent); }
.cm-s-ws .CodeMirror-selected { background: var(--accent-soft); }
.cm-s-ws.CodeMirror-focused .CodeMirror-selected { background: color-mix(in srgb, var(--accent) 28%, transparent); }
.cm-s-ws .CodeMirror-activeline-background { background: color-mix(in srgb, var(--text) 5%, transparent); }
.cm-s-ws .cm-keyword { color: var(--syn-kw); }
.cm-s-ws .cm-atom, .cm-s-ws .cm-number { color: var(--syn-num); }
.cm-s-ws .cm-string, .cm-s-ws .cm-string-2 { color: var(--syn-str); }
.cm-s-ws .cm-comment { color: var(--syn-com); font-style: italic; }
.cm-s-ws .cm-variable, .cm-s-ws .cm-variable-2, .cm-s-ws .cm-def, .cm-s-ws .cm-property { color: var(--syn-var); }
.cm-s-ws .cm-operator, .cm-s-ws .cm-punctuation, .cm-s-ws .cm-bracket { color: var(--text); }
.cm-s-ws .cm-ws-api { color: var(--syn-api); font-weight: 500; }
.cm-s-ws .CodeMirror-matchingbracket { color: var(--accent) !important; text-decoration: underline; }
.cm-s-ws .CodeMirror-nonmatchingbracket { color: var(--err) !important; }
.cm-err-line { background: var(--err-soft); }
.cm-err-gutter { color: var(--err) !important; font-weight: 700; }

/* ---------- narrow screens ---------- */
@media (max-width: 959px), (max-height: 639px) {
  .editor { height: clamp(400px, 64vh, 580px); }
  .ed-bar .file { display: none; }
}

/* ---------- desktop workbench ---------- */
@media (min-width: 960px) and (min-height: 640px) {
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 390px; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
  .top { grid-column: 1 / -1; }
  .stage { display: grid; grid-template-rows: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; min-height: 0; }
  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .preview, .editor { height: auto; min-height: 0; }
  .mission { flex: 0 1 auto; max-height: 58%; overflow-y: auto; }
  .log { flex: 1 1 0; }
  .msgs { max-height: none; min-height: 0; }
}
@media (max-width: 720px) {
  .step-label { display: none; }
  .path-name { display: none; }
  .link { margin-top: 14px; }
  .tools { width: 100%; justify-content: space-between; margin-left: 0; }
  .top { gap: 10px; }
  .ws-nav { padding: 0 16px; }
  .home-hero { min-height: min(50vh, 360px); }
  .home-body { padding: 24px 16px 40px; }
  .journey-hero { padding: 24px 16px 20px; }
  .journey-body { padding: 20px 16px 40px; gap: 20px; }
  .exercise-row { grid-template-columns: 60px 1fr auto; }
}
@media (pointer: coarse) {
  .btn, .seg button, .linkbtn { min-height: 44px; }
  .btn.small { min-height: 44px; }
  .step { min-height: 44px; justify-content: center; }
  .ed-tabs button { min-height: 44px; }
  .eng-sel { min-height: 44px; }
  .fg-item button { min-height: 44px; min-width: 44px; }
  .btn-hero, .btn-hero-sec, .btn-start, .btn-done, .btn-locked { min-height: 44px; }
  .chapter-header { min-height: 64px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

.app { display: flex; flex-direction: column; gap: 12px; min-height: 100%; }
.app[hidden], .view[hidden] { display: none; }

/* ---------- shell: home and journey ---------- */
.view { min-height: 100%; display: flex; flex-direction: column; gap: 18px; animation: viewin 0.22s ease-out; }
@keyframes viewin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.view-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.view-top .sp { flex: 1; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.back:hover { background: var(--panel-2); }
.back svg { width: 14px; height: 14px; }
.hero { position: relative; overflow: hidden; border-radius: 16px; border: 1px solid var(--line); background:
  radial-gradient(120% 90% at 85% 10%, var(--accent-soft), transparent 60%),
  radial-gradient(90% 80% at 0% 100%, var(--ok-soft), transparent 60%), var(--panel);
  padding: clamp(22px, 5vw, 48px); display: grid; gap: 18px; }
.hero h1 { margin: 0; font-family: var(--f-display); font-size: clamp(34px, 7vw, 58px); line-height: 1; letter-spacing: -0.03em; }
.hero .promise { margin: 0; font-size: clamp(17px, 2.4vw, 21px); max-width: 34ch; }
.hero .sub { margin: 0; color: var(--muted); max-width: 52ch; }
.hero-art { position: absolute; right: -30px; bottom: -40px; width: min(46vw, 340px); opacity: 0.9; pointer-events: none; animation: drift 18s linear infinite; }
@keyframes drift { to { transform: rotate(360deg); } }
.hero > *:not(.hero-art) { position: relative; }
.cta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn.big { min-height: 52px; padding: 0 26px; font-size: 17px; border-radius: 12px; }
.note-small { font-size: 12px; color: var(--muted); margin: 0; }
.home-sec h2, .unit h3 { margin: 0 0 10px; font-family: var(--f-display); font-size: 18px; }
.level { display: grid; gap: 10px; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
.level-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.level-head h2 { margin: 0; font-family: var(--f-display); font-size: 22px; }
.level-head .sp { flex: 1; }
.bar { height: 10px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--ok)); border-radius: inherit; transition: width 0.5s ease; }
.units { display: grid; gap: 14px; }
.unit { padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
.unit.soon { background: repeating-linear-gradient(135deg, var(--panel), var(--panel) 12px, var(--panel-2) 12px, var(--panel-2) 24px); }
.unit-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.unit-head h3 { margin: 0; }
.unit-num { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.pill { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.unit p { margin: 4px 0 0; color: var(--muted); }
.nodes { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 4px; }
.node { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; }
.node:nth-child(even) { margin-left: clamp(0px, 8vw, 64px); }
.node button { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel-2); cursor: pointer; display: grid; place-items: center; font-weight: 700; font-size: 18px; transition: transform 0.15s, box-shadow 0.15s; }
.node button:hover:not([disabled]) { transform: translateY(-2px); }
.node.open button { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 6px var(--accent-soft); }
.node.done button { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.node.locked button { cursor: not-allowed; opacity: 0.7; }
.node button svg { width: 22px; height: 22px; }
.node-text { min-width: 0; }
.node-text strong { display: block; }
.node-text span { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.flash { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.flash[hidden] { display: none; }
.lesson-back { margin-right: 2px; }
.engines { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.engine { text-align: left; display: grid; grid-template-columns: 44px 1fr; gap: 4px 12px; align-items: center; padding: 14px; min-height: 76px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; transition: border-color 0.15s, transform 0.15s; }
.engine:hover { transform: translateY(-1px); }
.engine[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.engine svg { grid-row: span 2; width: 44px; height: 44px; }
.engine strong { font-size: 15px; }
.engine span { font-size: 12.5px; color: var(--muted); }
.eng-sel { min-height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 0 8px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.pv-title { position: absolute; right: 10px; top: 10px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; background: rgba(0, 0, 0, 0.35); color: #fff; pointer-events: none; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
.brand svg { width: 26px; height: 26px; flex: none; }
.path { flex: 1 1 360px; min-width: 0; display: flex; align-items: center; gap: 12px; }
.path-name { font-size: 13px; color: var(--muted); white-space: nowrap; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; align-items: flex-start; flex: 1; min-width: 0; }
.steps li { display: flex; align-items: flex-start; flex: 1 1 0; min-width: 0; }
.steps li:last-child { flex: 0 0 auto; }
.step { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; cursor: pointer; min-width: 44px; }
.step[disabled] { cursor: not-allowed; }
.dot {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  border: 2px solid var(--line); background: var(--panel); color: var(--muted);
  font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums;
  transition: background-color 0.2s, border-color 0.2s, color 0.2s;
}
.dot svg { width: 14px; height: 14px; }
.step.done .dot { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.step.current .dot { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.step-label { font-size: 11.5px; color: var(--muted); max-width: 90px; text-align: center; line-height: 1.2; }
.step.current .step-label { color: var(--text); }
.link { flex: 1; height: 2px; background: var(--line); margin: 14px 4px 0; border-radius: 2px; min-width: 8px; }
.link.done { background: var(--ok); }
.tools { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.xp { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.xp.pop { animation: pop 0.5s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.18); } 100% { transform: scale(1); } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 6px 11px; min-height: 32px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); }

/* ---------- panels ---------- */
.stage, .side { display: contents; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }

/* preview */
.preview { position: relative; overflow: hidden; height: clamp(250px, 42vh, 420px); order: 1; background: var(--panel-2); }
.preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
.preview canvas:active { cursor: grabbing; }
.chips { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.chip { font-size: 12px; font-variant-numeric: tabular-nums; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--bg) 78%, transparent); border: 1px solid var(--line); color: var(--muted); backdrop-filter: blur(4px); }
.chip b { color: var(--text); font-weight: 600; margin-left: 4px; }
.pv-help { position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; color: var(--muted); pointer-events: none; padding: 2px 8px; border-radius: 6px; background: color-mix(in srgb, var(--bg) 70%, transparent); }
.empty { position: absolute; inset: 0; display: grid; place-content: center; padding: 16px; pointer-events: none; }
.empty > div { text-align: center; padding: 14px 20px; border-radius: 10px; background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); box-shadow: var(--shadow); max-width: 34ch; }
.empty strong { display: block; font-family: var(--f-display); font-size: 17px; color: var(--text); }
.empty span { display: block; color: var(--muted); margin-top: 2px; }
.empty[hidden] { display: none; }
.glerr { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; text-align: center; color: var(--err); }

/* editor */
.editor { order: 3; display: flex; flex-direction: column; overflow: hidden; height: clamp(300px, 44vh, 420px); }
.ed-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.file { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); padding: 3px 8px; border-radius: 6px; background: var(--panel-2); }
.ed-bar .sp { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; border: 1px solid var(--line); background: transparent; padding: 7px 13px; min-height: 36px; cursor: pointer; font-weight: 500; transition: background-color 0.15s, border-color 0.15s, transform 0.1s; }
.btn:hover { background: var(--panel-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn svg { width: 13px; height: 13px; }
.btn kbd { font-size: 11px; opacity: 0.75; padding-left: 2px; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.ed-body { flex: 1; min-height: 0; position: relative; background: var(--code-bg); }
.ed-body[hidden] { display: none; }
.ed-tabs button { min-height: 36px; }
.ed-tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.pm { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: var(--code-bg); }
.pm[hidden] { display: none; }
.pm-off { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); font-size: 13px; }
.pm-off[hidden] { display: none; }
.pm label { font-size: 12.5px; color: var(--muted); }
.pm textarea { width: 100%; box-sizing: border-box; min-height: 76px; resize: vertical; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 14px/1.45 var(--f-body); }
.pm textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.pm textarea:disabled { opacity: 0.55; cursor: not-allowed; }
.pm-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pm-row .sp { flex: 1; }
.pm-count, .pm-cmds { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pm-status { font-size: 13px; color: var(--muted); min-height: 1.4em; overflow-wrap: anywhere; }
.pm-status.err { color: var(--err); }
.pm-status.ok { color: var(--ok); }
.pm-status.busy::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 7px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: pmspin 0.8s linear infinite; vertical-align: -1px; }
@keyframes pmspin { to { transform: rotate(360deg); } }
.pm-result { padding: 9px 11px; border-radius: 8px; background: var(--ok-soft); font-size: 13.5px; }
.pm-result[hidden] { display: none; }
.pm-result p { margin: 0 0 6px; }
.pm-result .tag { margin-top: 6px; font-size: 11.5px; color: var(--muted); }
.fg-cap { margin: 0 0 4px !important; font-size: 12.5px; color: var(--muted); }
.fg-code { margin: 0 0 8px; padding: 6px 9px; border-radius: 6px; background: var(--panel-2); font: 12.5px/1.45 var(--f-mono); overflow-wrap: anywhere; white-space: pre-wrap; }
.fg-head { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.fg-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.fg-none { margin: 0; font-size: 13px; color: var(--muted); }
.fg-item { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
.fg-item button { background: transparent; border: 0; color: var(--text); cursor: pointer; padding: 6px 10px; min-height: 36px; font: 13px var(--f-body); }
.fg-item button:hover { background: var(--panel-2); }
.fg-item button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.fg-item .del { color: var(--muted); border-left: 1px solid var(--line); padding: 6px 9px; }
.fg-item button:disabled { opacity: 0.5; cursor: not-allowed; }
.ed-body .CodeMirror { position: absolute; inset: 0; height: 100%; }
.status { display: flex; gap: 8px; align-items: baseline; padding: 7px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); min-height: 34px; font-variant-numeric: tabular-nums; }
.status span { min-width: 0; overflow-wrap: anywhere; }
.status code { background: color-mix(in srgb, var(--text) 10%, transparent); padding: 1px 5px; border-radius: 4px; }
.status.ok { color: var(--ok); }
.status.err { color: var(--err); background: var(--err-soft); }

/* mission card */
.mission { order: 2; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.mission .count { font-size: 12.5px; color: var(--muted); }
.mission h2 { font-family: var(--f-display); font-size: 22px; line-height: 1.15; margin: 2px 0 0; letter-spacing: -0.01em; text-wrap: balance; }
.mission p { margin: 0; max-width: 62ch; }
.goals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.goals-title { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
.goal { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; background: var(--panel-2); }
.goal .ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; color: transparent; transition: background-color 0.2s, border-color 0.2s; }
.goal .ck svg { width: 11px; height: 11px; }
.goal.done .ck { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.goal .gl { flex: 1; min-width: 0; }
.goal .now { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.goal.done .now { color: var(--ok); }

/* coach log */
.log { order: 4; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.log-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-family: var(--f-display); font-weight: 700; }
.log-head svg { width: 20px; height: 20px; }
.msgs { flex: 1; min-height: 140px; max-height: 340px; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 9px 12px; border-radius: 4px 12px 12px 12px; background: var(--panel-2); max-width: 100%; overflow-wrap: anywhere; animation: rise 0.25s ease-out; }
.msg.hint { background: var(--accent-soft); }
.msg.error { background: var(--err-soft); }
.msg.success { background: var(--ok-soft); }
.msg code { background: color-mix(in srgb, var(--text) 10%, transparent); padding: 1px 5px; border-radius: 4px; }
.msg ul { margin: 6px 0 0; padding-left: 18px; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line); }
.foot { padding: 0 14px 12px; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 32px; }
.log-head .sp { flex: 1; }
.log-head .seg button { padding: 3px 10px; }
.log-head .seg button:disabled { opacity: 0.45; cursor: not-allowed; }
.srv { font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.srv::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.srv.ready::before { background: var(--ok); }
.srv.off::before { background: var(--err); }
.note { margin: 0 0 6px; font-size: 12px; color: var(--muted); max-width: 52ch; }
.msg.pending { background: var(--panel-2); color: var(--muted); font-style: italic; }
.tag { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
.tag b { font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.tag.rules b { background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.tag .linkbtn { min-height: 24px; padding: 0; font-size: 11.5px; }
.msg .verdict { font-weight: 600; }
.task { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
.task h4 { margin: 0 0 4px; font-family: var(--f-display); font-size: 15px; }
.task p { margin: 0 0 6px; }
.task ul { margin: 0 0 8px; padding-left: 18px; }
.task .btn { margin-top: 2px; }

/* confirm bar */
.confirm { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; width: min(94vw, 540px); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--accent); box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4); }
.confirm p { margin: 0; flex: 1 1 220px; }
.confirm .row { display: flex; gap: 8px; }

/* CodeMirror theme */
.cm-s-ws.CodeMirror { background: var(--code-bg); color: var(--text); font-family: var(--f-mono); font-size: 13.5px; line-height: 1.6; }
.cm-s-ws .CodeMirror-gutters { background: var(--code-bg); border-right: 1px solid var(--line); }
.cm-s-ws .CodeMirror-linenumber { color: var(--syn-com); padding: 0 8px 0 6px; }
.cm-s-ws .CodeMirror-cursor { border-left: 2px solid var(--accent); }
.cm-s-ws .CodeMirror-selected { background: var(--accent-soft); }
.cm-s-ws.CodeMirror-focused .CodeMirror-selected { background: color-mix(in srgb, var(--accent) 28%, transparent); }
.cm-s-ws .CodeMirror-activeline-background { background: color-mix(in srgb, var(--text) 5%, transparent); }
.cm-s-ws .cm-keyword { color: var(--syn-kw); }
.cm-s-ws .cm-atom, .cm-s-ws .cm-number { color: var(--syn-num); }
.cm-s-ws .cm-string, .cm-s-ws .cm-string-2 { color: var(--syn-str); }
.cm-s-ws .cm-comment { color: var(--syn-com); font-style: italic; }
.cm-s-ws .cm-variable, .cm-s-ws .cm-variable-2, .cm-s-ws .cm-def, .cm-s-ws .cm-property { color: var(--syn-var); }
.cm-s-ws .cm-operator, .cm-s-ws .cm-punctuation, .cm-s-ws .cm-bracket { color: var(--text); }
.cm-s-ws .cm-ws-api { color: var(--syn-api); font-weight: 500; }
.cm-s-ws .CodeMirror-matchingbracket { color: var(--accent) !important; text-decoration: underline; }
.cm-s-ws .CodeMirror-nonmatchingbracket { color: var(--err) !important; }
.cm-err-line { background: var(--err-soft); }
.cm-err-gutter { color: var(--err) !important; font-weight: 700; }

/* ---------- narrow screens: give the editor panes room ---------- */
@media (max-width: 959px), (max-height: 639px) {
  .editor { height: clamp(400px, 64vh, 580px); }
  .ed-bar .file { display: none; }
}

/* ---------- desktop workbench ---------- */
@media (min-width: 960px) and (min-height: 640px) {
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 390px; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
  .top { grid-column: 1 / -1; }
  .stage { display: grid; grid-template-rows: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; min-height: 0; }
  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .preview, .editor { height: auto; min-height: 0; }
  .mission { flex: 0 1 auto; max-height: 58%; overflow-y: auto; }
  .log { flex: 1 1 0; }
  .msgs { max-height: none; min-height: 0; }
}
@media (max-width: 720px) {
  .step-label { display: none; }
  .path-name { display: none; }
  .link { margin-top: 14px; }
  .tools { width: 100%; justify-content: space-between; margin-left: 0; }
  .top { gap: 10px; }
}
@media (pointer: coarse) {
  .btn, .seg button, .linkbtn { min-height: 44px; }
  .btn.small { min-height: 44px; }
  .step { min-height: 44px; justify-content: center; }
  .ed-tabs button { min-height: 44px; }
  .eng-sel { min-height: 44px; }
  .fg-item button { min-height: 44px; min-width: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
/* touch-size engine picker on phones, whatever the pointer media query reports */
@media (max-width: 720px), (pointer: coarse) { .eng-sel { min-height: 44px; } }

/* ===================== Worldsmith brand layer: forge palette, 3 px borders, hard offset shadows ===================== */
:root, :root[data-theme="light"], :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14110f; --panel: #1b1713; --panel-2: #241e19; --line: #3a3d42; --line-2: #6b6f76;
  --text: #f3ece4; --muted: #c2b6a8; --accent: #e0702b; --accent-ink: #14110f; --accent-soft: rgba(224, 112, 43, 0.16);
  --fire: #f5b13d; --grass: #6fae3f; --dirt: #7a4a2b; --sky: #8fc5ee; --iron: #6b6f76; --iron-d: #3a3d42;
  --ok: #7cc24a; --ok-soft: rgba(111, 174, 63, 0.18); --err: #ff7a66; --err-soft: rgba(255, 122, 102, 0.14);
  --code-bg: #110e0c; --hard: 4px 4px 0 #000;
  --f-display: "Press Start 2P", "Courier New", monospace; --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --px: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px));
}
@media (prefers-color-scheme: light) { :root { color-scheme: dark; } }
body { background: var(--bg); color: var(--text); }
:focus-visible { outline: 3px solid var(--fire); outline-offset: 2px; }
.panel, .level, .unit, .engine, .hero { border: 3px solid var(--line); border-radius: 0; box-shadow: var(--hard); }
.btn { border: 3px solid var(--line); border-radius: 0; box-shadow: 3px 3px 0 #000; font-weight: 700; }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
.btn.primary { background: var(--accent); border-color: #000; color: var(--accent-ink); box-shadow: inset -3px -3px 0 rgba(0, 0, 0, 0.25), 3px 3px 0 #000; }
.btn.primary:hover { background: #ec7d36; }
.btn[disabled] { box-shadow: none; }
.seg { border: 3px solid var(--line); border-radius: 0; }
.eng-sel { border: 3px solid var(--line); border-radius: 0; background: var(--panel); }
textarea, select { border-radius: 0 !important; }
.pm textarea, #wsText { border: 3px solid var(--line); background: var(--code-bg); }
.logo-block { width: 28px; height: 28px; image-rendering: pixelated; flex: none; filter: drop-shadow(2px 2px 0 #000); }
.anvi { width: 48px; height: 39px; flex: none; filter: drop-shadow(2px 2px 0 #000); }

/* top bar */
.topnav { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  margin: 0 0 12px; padding: 8px 10px; background: var(--panel); border: 3px solid var(--line); box-shadow: var(--hard); }
.tn-brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--text); text-decoration: none; }
.tn-brand span { font-family: var(--f-display); font-size: 13px; letter-spacing: 0.02em; }
.tn-links { display: flex; gap: 6px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tn-links::-webkit-scrollbar { display: none; }
.tn-links a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; white-space: nowrap; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 13.5px; border: 3px solid transparent; }
.tn-links a:hover { color: var(--text); }
.tn-links a[aria-current="page"] { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
.tn-tools { display: flex; gap: 8px; align-items: center; }
.tn-tools .seg button, .tn-tools .eng-sel { min-height: 44px; }
@media (max-width: 720px) {
  .topnav { gap: 6px 8px; }
  .tn-links { order: 3; flex-basis: 100%; }
  .tn-tools { margin-left: auto; }
  .tn-brand span { font-size: 11px; }
}

/* workshop: Cloud Forge */
.ws { display: grid; gap: 16px; }
.ws-head { display: flex; gap: 14px; align-items: center; }
.ws-head .anvi { width: 64px; height: 52px; }
.eyebrow { margin: 0 0 6px; font-family: var(--f-display); font-size: 10px; color: var(--fire); letter-spacing: 0.06em; }
.ws-head h1 { margin: 0; font-family: var(--f-display); font-size: clamp(18px, 3.4vw, 28px); line-height: 1.3; }
.ws-head .sub { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }
.flow { display: grid; grid-template-columns: 1fr 64px 1.15fr 64px 1.2fr; align-items: stretch; }
.flow-node { position: relative; padding: 14px; background: var(--panel); border: 3px solid var(--line); box-shadow: var(--hard); display: grid; gap: 8px; align-content: start; min-width: 0; }
.flow-node.core { border-color: var(--accent); background: linear-gradient(180deg, rgba(224, 112, 43, 0.14), transparent 60%), var(--panel); }
.flow-node h3 { margin: 0; font-family: var(--f-display); font-size: 11px; line-height: 1.5; }
.flow-node > p { margin: 0; color: var(--muted); font-size: 13px; }
.flow-node svg.icon { width: 40px; height: 40px; }
.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--f-mono); overflow-wrap: anywhere; }
.kv dd.ok { color: var(--ok); } .kv dd.bad { color: var(--err); } .kv dd.wait { color: var(--fire); }
.flow-link { position: relative; align-self: center; height: 12px; margin: 0 -3px; background: repeating-linear-gradient(90deg, var(--iron-d) 0 8px, transparent 8px 12px); }
.flow-link i { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, var(--fire) 0 8px, transparent 8px 24px); opacity: 0; }
.flow.live .flow-link i { opacity: 1; animation: flowrun 0.6s steps(3) infinite; }
@keyframes flowrun { to { background-position: 24px 0; } }
.ws-canvas { width: 100%; aspect-ratio: 4 / 3; display: block; background: linear-gradient(180deg, #8fc5ee, #cfe6f6); border: 3px solid #000; image-rendering: auto; }
.ws-off { margin: 0; padding: 10px 12px; border: 3px solid var(--err); background: var(--err-soft); }
.ws-off[hidden] { display: none; }
.ws-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
.ws-form, .ws-gallery { padding: 14px; display: grid; gap: 10px; }
.ws-form label { font-size: 13px; color: var(--muted); }
#wsGo, #wsUse { min-height: 44px; }
#wsText { width: 100%; box-sizing: border-box; min-height: 64px; resize: vertical; padding: 9px 10px; color: var(--text); font: 15px/1.45 var(--f-body); }
.ws-result { padding: 12px; border: 3px solid var(--ok); background: var(--ok-soft); display: grid; gap: 8px; }
.ws-result[hidden] { display: none; }
.ws-result p { margin: 0; }
.ws-line { display: block; padding: 8px 10px; background: var(--code-bg); border: 3px solid #000; font-family: var(--f-mono); font-size: 13.5px; color: var(--fire); overflow-x: auto; }
.ws-gallery h2 { margin: 0; font-family: var(--f-display); font-size: 12px; }
.ws-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.ws-list li { display: flex; }
.ws-list button { min-height: 44px; padding: 0 12px; border: 3px solid var(--line); background: var(--panel-2); color: var(--text); font-weight: 700; cursor: pointer; }
.ws-list button[aria-pressed="true"] { border-color: var(--fire); }
.ws-list button.del { min-width: 44px; padding: 0; color: var(--muted); border-left: 0; }
.empty-note { margin: 0; color: var(--muted); }
.empty-note[hidden] { display: none; }
@media (max-width: 860px) {
  .flow { grid-template-columns: 1fr; }

.hero2 h1 { margin: 0; font-family: var(--f-display); font-size: clamp(24px, 5.2vw, 46px); line-height: 1.15; color: var(--fire); text-shadow: 4px 4px 0 #000; letter-spacing: 0; }
.hero2 .promise { margin: 0; font-size: clamp(18px, 2.6vw, 24px); font-weight: 700; max-width: 30ch; }

#heroCanvas { width: 100%; aspect-ratio: 1 / 1; max-height: 340px; display: block; }
.hero-tag { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.hero2 > canvas.sparks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.hero2 > .hero-text, .hero2 > .hero-stage { z-index: 1; }
.home-band { display: grid; gap: 12px; }
.home-band > h2, .home-sec > h2 { margin: 0; font-family: var(--f-display); font-size: clamp(13px, 2vw, 16px); line-height: 1.5; color: var(--text); }
.problem { padding: 18px; border: 3px solid var(--dirt); background: repeating-linear-gradient(135deg, rgba(122, 74, 43, 0.14) 0 10px, transparent 10px 20px), var(--panel); box-shadow: var(--hard); }
.big-quote { margin: 0; font-size: clamp(17px, 2.3vw, 21px); line-height: 1.5; max-width: 62ch; }
.cards3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.vcard { padding: 16px; background: var(--panel); border: 3px solid var(--line); box-shadow: var(--hard); display: grid; gap: 8px; align-content: start; }
.vcard h3, .steps3 h3 { margin: 0; font-size: 16px; }
.vcard p, .steps3 p { margin: 0; color: var(--muted); }
.vicon { width: 48px; height: 40px; display: block; image-rendering: pixelated; }
.vicon .anvi { width: 48px; height: 39px; }
.vicon.v1 { background: linear-gradient(var(--sky) 0 0) 0 0 / 48px 18px no-repeat, linear-gradient(#000 0 0) 0 18px / 48px 3px no-repeat, linear-gradient(var(--code-bg) 0 0) 0 21px / 48px 19px no-repeat; border: 3px solid #000; box-sizing: border-box; }
.vicon.v3 { background: linear-gradient(90deg, var(--grass) 0 33%, var(--fire) 33% 66%, var(--accent) 66%); clip-path: var(--px); }
.steps3 { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; counter-reset: s; }
.steps3 li { position: relative; padding: 16px 16px 16px 64px; background: var(--panel); border: 3px solid var(--line); box-shadow: var(--hard); display: grid; gap: 6px; }
.steps3 b { position: absolute; left: 14px; top: 14px; width: 36px; height: 36px; display: grid; place-items: center; font-family: var(--f-display); font-size: 14px; background: var(--accent); color: var(--accent-ink); clip-path: var(--px); }
.steps3 li:not(:last-child)::after { content: ""; position: absolute; right: -14px; top: 50%; width: 14px; height: 6px; background: var(--fire); }
.meas { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.meas li { padding: 14px; background: var(--panel-2); border: 3px solid var(--line); display: grid; gap: 4px; }
.meas b { font-family: var(--f-display); font-size: 18px; color: var(--ok); }
.meas span { color: var(--muted); font-size: 13.5px; }
.faq { display: grid; gap: 8px; }
.faq details { background: var(--panel); border: 3px solid var(--line); }
.faq summary { min-height: 44px; display: flex; align-items: center; padding: 8px 14px; cursor: pointer; font-weight: 700; list-style: none; }
.faq summary::before { content: "+"; font-family: var(--f-display); font-size: 12px; color: var(--fire); margin-right: 12px; }
.faq details[open] summary::before { content: "-"; }
.faq summary::-webkit-details-marker { display: none; }
.faq p { margin: 0; padding: 0 14px 14px 38px; color: var(--muted); }
.site-foot { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 16px 0 6px; border-top: 3px solid var(--line); color: var(--muted); font-size: 13px; }

@media (max-width: 860px) {

/* roadmap: biome world map */
#journeyView { gap: 16px; }
.jbar { position: sticky; top: var(--navh, 90px); z-index: 10; background: var(--panel); }
.jbar .level-head { gap: 8px 12px; }
.streak { font-size: 12.5px; font-weight: 700; padding: 4px 9px; border: 3px solid var(--line); color: var(--muted); }
.streak.on { color: var(--fire); border-color: var(--fire); }
.jbar .bar { height: 14px; border-radius: 0; border: 3px solid #000; background: var(--code-bg); }
.jbar .bar i { border-radius: 0; background: repeating-linear-gradient(90deg, var(--grass) 0 10px, #5f9a34 10px 14px); }
.unit { position: relative; overflow: hidden; padding: 18px 18px 44px; }
.unit > * { position: relative; }
.unit .decor { position: absolute; inset: auto 0 0 0; height: 26px; pointer-events: none; }
.biome-name { display: inline-block; margin-bottom: 6px; font-family: var(--f-display); font-size: 9px; letter-spacing: 0.08em; padding: 4px 6px; background: rgba(0, 0, 0, 0.35); }
.biome-meadow { background: linear-gradient(180deg, rgba(143, 197, 238, 0.12), transparent 40%), #1d2416; border-color: #4d7a2c; }
.biome-meadow .decor { background: linear-gradient(90deg, #6fae3f 0 8px, #5f9a34 8px 16px) 0 0 / 16px 8px repeat-x, linear-gradient(#7a4a2b 0 0) 0 8px / 100% 18px no-repeat; }
.biome-meadow .biome-name { color: #9fd36a; }
.biome-quarry { background: repeating-linear-gradient(135deg, #24211f 0 14px, #2b2724 14px 28px); border-color: #6b6f76; }
.biome-quarry .decor { background: linear-gradient(90deg, #6b6f76 0 12px, #55585e 12px 20px, #7c8087 20px 28px) 0 0 / 28px 10px repeat-x, linear-gradient(#3a3d42 0 0) 0 10px / 100% 16px no-repeat; }
.biome-quarry .biome-name { color: #c9ccd1; }
.biome-cave { background: radial-gradient(60% 80% at 80% 20%, rgba(245, 177, 61, 0.08), transparent 60%), #120f14; border-color: #3b3346; }
.biome-cave .decor { background: linear-gradient(90deg, #2a2430 0 10px, #1c1820 10px 18px) 0 0 / 18px 26px repeat-x; }
.biome-cave .biome-name { color: #b9a6d6; }
.unit.soon { background-blend-mode: normal; }
.unit.soon::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, transparent 0 12px, rgba(0, 0, 0, 0.18) 12px 24px); pointer-events: none; }
.nodes { position: relative; margin: 18px 0 30px; display: grid; gap: 18px; }
.node:not(:first-child) button::before { content: none; }
.node:not(:first-child)::before { content: ""; position: absolute; left: 31px; top: -18px; width: 6px; height: 18px; background: repeating-linear-gradient(180deg, #7a4a2b 0 6px, transparent 6px 9px); }
.node, .node:nth-child(even) { position: relative; margin-left: calc(var(--x, 0) * 1%); grid-template-columns: 72px auto auto; justify-content: start; }
.node button { width: 68px; height: 68px; border-radius: 0; border: 3px solid #000; clip-path: var(--px); position: relative; font-family: var(--f-display); font-size: 16px; box-shadow: none;
  background: linear-gradient(#9aa0a8 0 0) 0 0 / 100% 6px no-repeat, var(--iron); color: #1b1713; }
.node.locked button { background: linear-gradient(#55585e 0 0) 0 0 / 100% 6px no-repeat, var(--iron-d); color: #9aa0a8; opacity: 1; }
.node.open button { background: linear-gradient(#ffd27a 0 0) 0 0 / 100% 6px no-repeat, var(--fire); color: #14110f; animation: pulse 1.6s steps(4) infinite; }
.node.done button { background: linear-gradient(#9fd36a 0 0) 0 0 / 100% 6px no-repeat, var(--grass); color: #10200a; }
.node button svg { width: 26px; height: 26px; }
@keyframes pulse { 0%, 100% { filter: none; } 50% { filter: brightness(1.18) drop-shadow(0 0 6px #f5b13d); } }
.node .spark { position: absolute; right: 6px; top: 6px; width: 6px; height: 6px; background: var(--fire); box-shadow: 6px -6px 0 #ffd27a, -6px -6px 0 var(--accent); }
.node-text strong { font-size: 15px; }
.anvi-pin { display: inline-flex; align-items: center; }
.anvi-pin .anvi { width: 44px; height: 36px; animation: hop 1.2s steps(2) infinite; }
@keyframes hop { 50% { transform: translateY(-4px); } }
@media (max-width: 720px) {
  .node, .node:nth-child(even) { margin-left: calc(var(--x, 0) * 0.6%); grid-template-columns: 72px 1fr; }
  .anvi-pin { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { .node.open button, .anvi-pin .anvi { animation: none; } }

function streakDays() {
  let n = 0, t = Date.now();
  if (!doneDays.includes(dayKey(t))) t -= 86400000;   // a streak survives until the end of the next day
  while (doneDays.includes(dayKey(t))) { n++; t -= 86400000; }
  return n;
}
const persist = () => {

    doneDays.push(dayKey(Date.now()));

const sameZ = (list) => list.length > 1 && list.every((p) => Math.abs(p.z - list[0].z) < 0.01);
const sameX = (list) => list.length > 1 && list.every((p) => Math.abs(p.x - list[0].x) < 0.01);
const minDist = (list) => {
  let m = Infinity;
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) m = Math.min(m, Math.hypot(list[i].x - list[j].x, list[i].z - list[j].z));
  return m;
};

/* =====================================================================
   Code runner: user code runs in a Web Worker and only returns plain commands
   ===================================================================== */
function workerBody() {
  const LIMIT = 400, MIN = -20, MAX = 20;
  class ApiError extends Error { constructor(info) { super(info.code); this.info = info; } }
  const mulberry32 = (a) => () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const show = (v) => (v === undefined ? 'undefined' : typeof v === 'string' ? JSON.stringify(v) : String(v));
  self.onmessage = (e) => {
    const code = String(e.data.code);
    const cmds = [];
    let objects = 0;
    const rnd = mulberry32(1337);
    const num = (fn, arg, v, lo, hi) => {
      if (typeof v !== 'number' || !isFinite(v)) throw new ApiError({ code: 'num', fn, arg, got: show(v) });
      if (v < lo || v > hi) throw new ApiError({ code: 'range', fn, arg, lo, hi, got: v });
      return v;
    };
    const known = Array.isArray(e.data.models) ? e.data.models.map(String) : [];
    let spawns = 0;
    const place = (kind, x, z, size, name) => {
      if (size === undefined) size = 1;
      x = num(kind, 'x', x, MIN, MAX); z = num(kind, 'z', z, MIN, MAX); size = num(kind, 'size', size, 0.3, 4);
      if (++objects > LIMIT) throw new ApiError({ code: 'limit', max: LIMIT });
      cmds.push(name === undefined ? { t: kind, x, z, size } : { t: kind, x, z, size, name });
    };
    const api = {
      ground(color) {
        if (typeof color !== 'string') throw new ApiError({ code: 'str', fn: 'ground', arg: 'color', got: show(color) });
        cmds.push({ t: 'ground', color });
      },
      tree(x, z, size) { place('tree', x, z, size); },
      rock(x, z, size) { place('rock', x, z, size); },
      house(x, z, size) { place('house', x, z, size); },
      spawn(name, x, z, size) {
        if (typeof name !== 'string') throw new ApiError({ code: 'str', fn: 'spawn', arg: 'name', got: show(name) });
        if (!known.includes(name)) throw new ApiError({ code: 'model', name, known });
        if (++spawns > 60) throw new ApiError({ code: 'spawnlimit', max: 60 });
        place('spawn', x, z, size, name);
      },
      sun(h) { cmds.push({ t: 'sun', h: num('sun', 'height', h, 0, 90) }); },
      fog(a) { cmds.push({ t: 'fog', a: num('fog', 'amount', a, 0, 1) }); },
      random(lo, hi) {
        if (lo === undefined) { lo = 0; hi = 1; } else if (hi === undefined) { hi = lo; lo = 0; }
        num('random', 'min', lo, -1e6, 1e6); num('random', 'max', hi, -1e6, 1e6);
        return lo + rnd() * (hi - lo);
      },
    };
    postMessage({ started: true });
    try {
      const fn = new Function(...Object.keys(api), '"use strict";\n' + code);
      fn(...Object.values(api));
      postMessage({ ok: true, cmds });
    } catch (err) {
      const m = /<anonymous>:(\d+):\d+/.exec(String((err && err.stack) || ''));
      postMessage({
        ok: false,
        line: m ? Math.max(1, Number(m[1]) - 3) : null,
        info: err instanceof ApiError ? err.info : { code: 'raw', name: String(err && err.name), message: String(err && err.message) },
      });
    }
  };
}
const API_NAMES = ['ground', 'tree', 'rock', 'house', 'sun', 'fog', 'random', 'spawn'];
let worker = null;
function spawnWorker() {
  const src = '(' + workerBody.toString() + ')();';
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  const w = new Worker(url);
  URL.revokeObjectURL(url);
  return w;
}
function execute(code) {
  return new Promise((resolve) => {
    try { if (!worker) worker = spawnWorker(); } catch (e) { resolve({ ok: false, line: null, info: { code: 'noworker' }, ms: 0 }); return; }
    const t0 = performance.now();
    const w = worker;
    // The 1.5 s budget starts when the worker reports that it began running the user's code,
    // so a busy main thread or a slow worker start never reads as an endless loop.
    let timer = null;
    const boot = setTimeout(() => { w.terminate(); worker = null; resolve({ ok: false, line: null, info: { code: 'noworker' }, ms: 0 }); }, 10000);
    w.onmessage = (e) => {
      if (e.data && e.data.started) {
        clearTimeout(boot);
        timer = setTimeout(() => { w.terminate(); worker = null; resolve({ ok: false, line: null, info: { code: 'timeout' }, ms: 1500 }); }, 1500);
        return;
      }
      clearTimeout(boot); clearTimeout(timer);
      resolve(Object.assign({}, e.data, { ms: Math.max(1, Math.round(performance.now() - t0)) }));
    };
    w.onerror = (e) => { clearTimeout(boot); clearTimeout(timer); worker = null; resolve({ ok: false, line: null, info: { code: 'raw', name: 'Error', message: e.message || 'unknown' }, ms: 0 }); };
    w.postMessage({ code, models: Object.keys(fg.models) });
  });
}

const lev = (a, b) => {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
};

function explain(info) {
  const tr = state.lang === 'tr';
  switch (info.code) {

  const stripped = code.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*$/gm, '');

  for (const k of cmds) {

    else if (k.t === 'spawn') c.counts.spawn++;

function sceneSummary(ctx) {

  const span = (key) => (all.length ? [r1(Math.min(...all.map((k) => k[key]))), r1(Math.max(...all.map((k) => k[key])))] : null);

    spread: all.length ? { x: span('x'), z: span('z') } : null,

/* One queue for every AI request (coach, Prompt, Forge): one at a time, and at most AI_PER_MIN started per minute,
   so a burst of clicks never trips the provider's per-minute quota (Gemini free tier: 15 per model). */
const AI_PER_MIN = 12;
const aiStarts = [];
let aiChain = Promise.resolve();
var aiQ = { pending: 0, last: null, model: null };   // read by the Workshop status panel; only measured values
function noteAi(kind, t0, status, data) {
  aiQ.last = { kind, ms: Math.round(performance.now() - t0), status, at: Date.now() };
  if (data && typeof data.model === 'string') aiQ.model = data.model;
  if (typeof wsTick === 'function') wsTick();
}
function aiSlot() {
  aiQ.pending++;
  let release;
  const gate = new Promise((r) => { release = r; });
  const prev = aiChain;
  aiChain = prev.then(() => gate);
  return prev.then(async () => {
    const now = Date.now();
    while (aiStarts.length && now - aiStarts[0] > 60000) aiStarts.shift();
    if (aiStarts.length >= AI_PER_MIN) await new Promise((r) => setTimeout(r, 60000 - (now - aiStarts[0]) + 50));
    aiStarts.push(Date.now());
    return () => { aiQ.pending--; release(); if (typeof wsTick === 'function') wsTick(); };
