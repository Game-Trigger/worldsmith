}
async function askCoach(stage, opts) {
  const ctx = opts && opts.noCtx ? null : currentCtx();
  const body = {
    lesson_id: LESSON_IDS[state.cur], stage, lang: state.lang, code: cm.getValue(),
    run_output: sceneSummary(ctx), error: (opts && opts.error) || null,
    goals: MISSIONS[state.cur].goals.map((g) => { const r = ctx ? g.check(ctx) : { done: false, now: '' }; return { label: g.label.en, done: r.done, now: r.now }; }),
    hints_used: opts && Number.isInteger(opts.hints) ? opts.hints : state.hints, history: state.chat.slice(-6),
  };
  const done = await aiSlot();   // the 13 s timer starts only once it is this request's turn
  const t0 = performance.now();
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), COACH_TIMEOUT);
  try {
    const r = await fetch('/api/coach', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal });
    let data = null;
    try { data = await r.json(); } catch (e) { data = null; }
    noteAi('coach', t0, r.status, data);
    if (r.ok && data && data.source === 'llm') return { ok: true, reply: data };
    const code = data && data.error && data.error.code;
    const quota = data && data.error && String(data.error.reason || '').startsWith('quota');
    return { ok: false, why: code === 'rate_limited' ? 'rate_limited' : quota ? 'quota' : 'unavailable' };

    noteAi('coach', t0, e && e.name === 'AbortError' ? 'timeout' : 'offline', null);
    return { ok: false, why: e && e.name === 'AbortError' ? 'timeout' : 'offline' };

}

/* One coach turn: show a pending bubble, ask, then fill it with the AI reply or the rule-based fallback.
   fb = { kind, text, extra?, xp? } is the rule-based feedback, already computed locally. Returns true on an AI reply. */
async function coachTurn(stage, fb, opts) {
  const id = ++state.req;
  state.turn = { stage, fb, opts };
  state.busy = true;
  const el = addMsg('pending', tt().pending);
  const res = await askCoach(stage, opts);   // builds the request body synchronously, before its first await
  if (id !== state.req || !el.isConnected) { el.remove(); return false; }   // a newer turn or mission replaced this one
  state.busy = false;
  renderActions();
  if (res.ok) {
    const rep = res.reply;
    el.className = 'msg ' + (stage === 'teach' ? 'hint' : rep.verdict === 'pass' ? 'success' : 'info');
    el.innerHTML = replyHtml(rep, fb);
    state.chat.push({ role: 'coach', text: rep.message });
    if (rep.task) state.task = rep.task;
  } else {
    el.className = 'msg ' + fb.kind;
    const body = fb.text ? md(fb.text) : '';
    el.innerHTML = body + (fb.extra || '') + rulesTag(res.why);

async function run(silent) {
  if (state.running) return;
  state.running = true;
  clearErr();
  const code = cm.getValue();
  const res = await execute(code);
  state.running = false;
  const m = MISSIONS[state.cur];

  if (!res.ok) {
    const text = explain(res.info);
    const lineTxt = res.line ? `${tt().line(res.line)}: ` : '';
    setStatus('err', lineTxt + text);
    markErr(res.line);
    if (!silent) {
      const msg = (state.lang === 'tr' ? 'Kod hata verdi. ' : 'The code hit an error. ') + text + (state.lang === 'tr' ? ' Düzelttikten sonra tekrar çalıştır.' : ' Fix it and run again.');
      if (aiOn()) coachTurn('evaluate', { kind: 'error', text: msg }, { noCtx: true, error: { code: String((res.info && res.info.code) || 'raw'), line: res.line || null, message: text } });
      else addMsg('error', msg);
    }
    return;
  }

  let rgb = [106, 153, 78], sunH = 55, fogA = 0;
  for (const k of res.cmds) {
    if (k.t === 'ground') {
      const p = parseColor(k.color);
      if (!p) {
        const text = explain({ code: 'color', value: k.color });
        setStatus('err', text);
        if (!silent) addMsg('error', (state.lang === 'tr' ? 'Zemin rengi okunamadı. ' : 'The ground colour could not be read. ') + text);
        return;
      }
      rgb = p;
    } else if (k.t === 'sun') sunH = k.h;
    else if (k.t === 'fog') fogA = k.a;
  }
  if (gl) rebuild(res.cmds, rgb, sunH, fogA);
  const ctx = analyse(code, res.cmds);
  state.last = { mission: state.cur, ctx };
  renderChips(ctx);
  renderGoals(ctx);
  const nObj = ctx.counts.tree + ctx.counts.rock + ctx.counts.house + ctx.counts.spawn;
  setStatus('ok', tt().ok(nObj, res.ms));
  if (silent) return;

  const allDone = m.goals.every((g) => g.check(ctx).done);
  if (!allDone) {
    if (aiOn()) coachTurn('evaluate', { kind: 'info', text: pick(m.miss(ctx)) });
    else addMsg('info', pick(m.miss(ctx)));
    return;
  }
  // Code that Prompt mode wrote, unchanged by the learner, meets the goals but earns no XP and unlocks nothing.
  if (fromPrompt(code)) {
    const note = `<div class="tag"><b>${esc(tt().pmNoXp)}</b></div>`;
    if (aiOn()) coachTurn('evaluate', { kind: 'success', text: pick(m.pass(ctx)), extra: note });
    else addMsg('success', pick(m.pass(ctx)), note);
    return;
  }
  const first = !state.done.includes(state.cur);
  let text = pick(m.pass(ctx));
  if (first) {
    state.done.push(state.cur);
    state.xp += 50;
    persist();
    text += ' +50 XP';
    const xp = $('#xp'); xp.textContent = tt().xp(state.xp); xp.classList.remove('pop'); void xp.offsetWidth; xp.classList.add('pop');
    try { if (navigator.vibrate) navigator.vibrate([30, 40, 30]); } catch (e) { /* unsupported */ }
  }
  const tail = state.cur === MISSIONS.length - 1 ? `<div style="margin-top:8px"><strong>${esc(tt().roadmapTitle)}</strong>${roadmapHtml()}</div>` : '';
  renderPath(); renderActions();
  // Goal checks above decide pass/fail and XP. The AI only explains; its verdict must agree (server enforces it).
  if (aiOn()) coachTurn('evaluate', { kind: 'success', text, extra: tail, xp: first });
  else addMsg('success', text, tail);
}

/* =====================================================================
   Prompt mode: the learner describes a scene, the model writes the code.
   The code is written into the editor and run with run(), so the page's goal checks still decide.
   ===================================================================== */
const UNLOCKS = [['ground', 'tree', 'rock'], ['random'], ['sun', 'fog'], ['house']];   // what each mission adds
const MODEL_TIMEOUT = 13000;   // the server gives up at 12 s
// A 503 whose reason is about the AI service itself (quota, key, network, timeout), not about what the model wrote:
// say that plainly instead of passing on raw provider JSON and asking for a simpler request.
const aiDown = (reason) => {
  const r = String(reason || ''), T = tt();
  return r.startsWith('quota') ? T.aiQuota : r.startsWith('timeout') ? T.pmTimeout : ['http', 'config', 'parse'].some((k) => r.startsWith(k)) ? T.aiService : '';
};
const pm = { tab: 'code', busy: false, req: 0, undo: null, generated: null };
const squash = (c) => String(c).replace(/\s+/g, '');
const fromPrompt = (code) => pm.generated !== null && squash(code) === pm.generated;
const unlocked = () => {
  const out = [];
  UNLOCKS.forEach((cmds, i) => { if (i <= state.cur || state.done.includes(i)) out.push(...cmds); });
  return API_NAMES.filter((n) => out.includes(n));

async function askModel(body) {
  const done = await aiSlot();   // the 13 s timer starts only once it is this request's turn
  const t0 = performance.now();
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), MODEL_TIMEOUT);
  try {
    const r = await fetch('/api/model', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal });
    let data = null;
    try { data = await r.json(); } catch (e) { data = null; }
    noteAi('model', t0, r.status, data);
    if (r.ok && data && data.source === 'llm' && typeof data.code === 'string') return { ok: true, reply: data };
    const err = (data && data.error) || {};
    if (r.status === 429) return { ok: false, text: tt().pmRate(err.retry_after || 60) };
    return { ok: false, text: aiDown(err.reason) || tt().pmBad(String(err.reason || err.message || 'HTTP ' + r.status).slice(0, 140)) };
  } catch (e) {
    noteAi('model', t0, e && e.name === 'AbortError' ? 'timeout' : 'offline', null);

  } finally { clearTimeout(timer); done(); }
}
async function modelIt() {
  const T = tt(), prompt = $('#pmText').value.trim();
  if (pm.busy || !aiOn()) return;
  if (!prompt) { pmStatus('err', T.pmEmpty); $('#pmText').focus(); return; }
  const id = ++pm.req, mission = state.cur;
  pm.busy = true; $('#pmResult').hidden = true; pmStatus('busy', T.pmBusy); renderPrompt();
  const body = { lesson_id: LESSON_IDS[mission], lang: state.lang, prompt: prompt.slice(0, 400), current_code: cm.getValue().slice(0, 6000),

  let res = await askModel(body), runErr = null;
  // A reply only reaches the editor after it ran cleanly in the worker; one failed run goes back to the model with the error.
  if (res.ok && id === pm.req) {
    let ran = await execute(res.reply.code);
    if (!ran.ok && id === pm.req) {
      pmStatus('busy', T.pmFixing);
      runErr = { line: ran.line || null, message: explain(ran.info) };
      res = await askModel(Object.assign({}, body, { error: runErr, attempt: 2 }));
      if (res.ok) {

        runErr = ran.ok ? null : { line: ran.line || null, message: explain(ran.info) };
      }
    }

  pm.busy = false;
  if (!res.ok || runErr) {
    pmStatus('err', res.ok ? T.pmRunFail((runErr.line ? T.line(runErr.line) + ': ' : '') + runErr.message) : res.text);
    renderPrompt();
    return;
  }
  pm.undo = { code: cm.getValue(), dirty: state.dirty };
  clearErr();
  cm.setValue(res.reply.code);
  pm.generated = squash(res.reply.code);
  state.dirty = false;   // the model's code is not the learner's own edit

async function askForge(body) {
  const done = await aiSlot();   // the 13 s timer starts only once it is this request's turn
  const t0 = performance.now();
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), MODEL_TIMEOUT);
  try {
    const r = await fetch('/api/forge', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal });
    let data = null;
    try { data = await r.json(); } catch (e) { data = null; }
    noteAi('forge', t0, r.status, data);
    if (r.ok && data && data.source === 'llm') {
      const m = sanitizeModel(data);
      if (m) return { ok: true, model: m, reply: data };
      return { ok: false, text: tt().fgBad('shape') };
    }
    const err = (data && data.error) || {};
    if (r.status === 429) return { ok: false, text: tt().fgRate(err.retry_after || 60) };
    return { ok: false, text: aiDown(err.reason) || tt().fgBad(String(err.reason || err.message || 'HTTP ' + r.status).slice(0, 140)) };
  } catch (e) {
    noteAi('forge', t0, e && e.name === 'AbortError' ? 'timeout' : 'offline', null);

}

/* A small second three.js view (workshop preview, home hero). It shares geometries and materials with the main scene. */
function miniStage(canvas) {
  if (!gl || !canvas) return null;
  let r;
  try { r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); } catch (e) { return null; }
  const sc = new THREE.Scene();
  const camr = new THREE.PerspectiveCamera(34, 4 / 3, 0.1, 300);
  sc.add(new THREE.HemisphereLight(0xfff4e6, 0x3a2a1c, 0.7));
  const key = new THREE.DirectionalLight(0xffd9a0, 0.75); key.position.set(8, 14, 10); sc.add(key);
  const holder = new THREE.Group(); sc.add(holder);
  let on = false, raf = 0;
  const fit = () => {
    const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); r.setSize(w, h, false);
    camr.aspect = w / h; camr.updateProjectionMatrix();
  };
  const frame = (t) => {
    if (!on) return;
    if (!reduceMotion) holder.rotation.y = t / 2800;
    r.render(sc, camr);
    if (!reduceMotion) raf = requestAnimationFrame(frame);
  };
  return {
    set(obj, dist, lookY) {
      while (holder.children.length) holder.remove(holder.children[0]);
      if (obj) holder.add(obj);
      camr.position.set(dist * 0.72, dist * 0.5, dist); camr.lookAt(0, lookY || 0, 0);
      if (on) { fit(); r.render(sc, camr); }
    },
    start() { if (on) return; on = true; fit(); raf = requestAnimationFrame(frame); },
    stop() { on = false; cancelAnimationFrame(raf); },
    fit,
  };
}

    + `<button type="button" class="del" data-wsdel="${esc(m.name)}" aria-label="${esc(T.wsDel(m.label))}" title="${esc(T.wsDel(m.label))}">×</button></li>`).join('');
  wsPreview();
  wsTick();
}
function wsEnter() {
  if (!ws.stage) ws.stage = miniStage($('#wsCanvas'));
  renderWorkshop();
  if (ws.stage) { ws.stage.start(); wsPreview(); }
  clearInterval(ws.timer);
  ws.timer = setInterval(wsTick, 1000);
}
function wsLeave() {
  if (!ws) return;
  if (ws.stage) ws.stage.stop();
  clearInterval(ws.timer);
}
async function wsForge() {
  const T = tt(), text = $('#wsText').value.trim();
  if (ws.busy || !aiOn()) return;
  if (!text) { wsStatus('err', T.fgEmpty); $('#wsText').focus(); return; }
  if (Object.keys(fg.models).length >= FG_MAX) { wsStatus('err', T.fgFull); return; }
  const id = ++ws.req;
  ws.busy = true; $('#wsResult').hidden = true; wsStatus('busy', T.fgBusy); renderWorkshop();
  const res = await askForge({ lang: state.lang, description: text.slice(0, 120), existing: Object.keys(fg.models) });
  if (id !== ws.req) return;
  ws.busy = false;
  if (!res.ok) { wsStatus('err', res.text); renderWorkshop(); return; }
  fg.models[res.model.name] = res.model;
  fgSave();
  ws.sel = res.model.name;
  $('#wsExplain').textContent = res.reply.explanation;
  $('#wsLine').textContent = T.wsLine(res.model.name);
  $('#wsTag').textContent = T.fgTag(res.reply.model || 'AI');
  $('#wsResult').hidden = false;
  wsStatus('ok', T.fgDone(res.model.label, res.model.parts.length));
  renderWorkshop(); renderForge();
}
$('#wsText').addEventListener('input', () => { $('#wsCount').textContent = `${$('#wsText').value.length} / 120`; });
$('#wsText').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('#wsGo').click(); } });
$('#wsGo').addEventListener('click', wsForge);
$('#wsUse').addEventListener('click', () => {
  if (!ws.sel || !fg.models[ws.sel]) return;
  ws.place = ws.sel;
  goLesson(lessonReady ? state.cur : firstOpen(), true);
});
$('#wsList').addEventListener('click', (e) => {
  const show = e.target.closest('[data-show]'), del = e.target.closest('[data-wsdel]');
  if (show && fg.models[show.dataset.show]) {
    ws.sel = show.dataset.show;
    $('#wsLine').textContent = tt().wsLine(ws.sel);
    renderWorkshop();
  } else if (del && fg.models[del.dataset.wsdel]) {
    const name = del.dataset.wsdel;
    ask(tt().cDelModel, () => { delete fg.models[name]; fgSave(); if (ws.sel === name) ws.sel = null; renderWorkshop(); renderForge(); });
  }
});
window.addEventListener('resize', () => { if (ws.stage && !views.workshop.hidden) { ws.stage.fit(); wsPreview(); } });


/* Home hero: a small voxel world on the shared mini stage, and ember sparks (both off when reduced motion is asked). */
var hero = { stage: null, sparks: null };
function heroWorld() {
  const g = grassBase(8, 8);
  if (typeof makeTree === 'function') {
    const t1 = makeTree(0, 0, 1); t1.position.set(-1.8, 0, -1.2); t1.scale.setScalar(UNIT.tree * 1.1); g.add(t1);
    const t2 = makeTree(0, 0, 1); t2.position.set(2.2, 0, 1.6); t2.scale.setScalar(UNIT.tree * 0.8); g.add(t2);
    const h = makeHouse(0, 0, 1); h.position.set(1.2, 0, -1.6); h.scale.setScalar(UNIT.house * 0.8); g.add(h);
    const r = makeRock(0, 0, 1); r.position.set(-2.2, 0, 2.2); r.scale.setScalar(UNIT.rock * 0.8); g.add(r);
  }
  return g;
}
function sparkField(canvas) {
  if (!canvas || reduceMotion) return null;
  const ctx = canvas.getContext('2d');
  if (!ctx) return null;
  const COLORS = ['#f5b13d', '#e0702b', '#ffd27a'];
  let parts = [], on = false, raf = 0, w = 0, h = 0;
  const fit = () => { w = canvas.width = canvas.clientWidth; h = canvas.height = canvas.clientHeight; };
  const spawn = () => ({ x: Math.random() * w, y: h + Math.random() * 40, v: 0.3 + Math.random() * 0.7, s: Math.random() < 0.3 ? 3 : 2, c: COLORS[(Math.random() * 3) | 0], life: 1 });
  const frame = () => {
    if (!on) return;
    ctx.clearRect(0, 0, w, h);
    while (parts.length < 26) parts.push(spawn());
    for (const q of parts) {
      q.y -= q.v; q.x += Math.sin(q.y / 30) * 0.3; q.life -= 0.0035;
      ctx.globalAlpha = Math.max(0, q.life) * 0.8; ctx.fillStyle = q.c; ctx.fillRect(q.x | 0, q.y | 0, q.s, q.s);
    }
    parts = parts.filter((q) => q.y > -10 && q.life > 0);
    raf = requestAnimationFrame(frame);
  };
  return { start() { if (on) return; on = true; fit(); raf = requestAnimationFrame(frame); }, stop() { on = false; cancelAnimationFrame(raf); }, fit };
}
function heroEnter() {
  if (!hero.stage) { hero.stage = miniStage($('#heroCanvas')); if (hero.stage) hero.stage.set(heroWorld(), 15, 1.4); }
  if (!hero.sparks) hero.sparks = sparkField($('#sparks'));
  if (hero.stage) { hero.stage.start(); hero.stage.set(heroWorld(), 15, 1.4); }
  if (hero.sparks) hero.sparks.start();
}
function heroLeave() {
  if (!hero) return;
  if (hero.stage) hero.stage.stop();
  if (hero.sparks) hero.sparks.stop();
}
window.addEventListener('resize', () => { if (hero.stage && !views.home.hidden) { hero.stage.fit(); if (hero.sparks) hero.sparks.fit(); } });

/* boot */
renderStatic();
renderShell();
applyEngine();
setStatus('', tt().idle);
route();
probeServer();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => cm.refresh());
setTimeout(() => cm.refresh(), 60);
window.addEventListener('resize', () => cm.refresh());
})();
</script>
